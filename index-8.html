<title>MIYAN TRADER OFFICIAL</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#020607;color:#fff;font-family:Arial,sans-serif}
.app{max-width:650px;margin:auto;min-height:100vh;padding:22px}
.top{display:flex;align-items:center;gap:15px;padding:10px 0 22px;border-bottom:1px solid #12363a}
.avatar{width:82px;height:82px;border-radius:18px;object-fit:contain;background:#05090b;border:2px solid #28e0d0;padding:3px}
.name{font-size:25px;font-weight:900} .sub{color:#28e0d0;letter-spacing:3px;font-size:12px;margin-top:7px}
.card{background:#071114;border:1px solid #123b40;border-radius:24px;padding:22px;margin-top:24px;box-shadow:0 0 35px #00ffe811}
label{display:block;color:#81969b;font-size:12px;letter-spacing:3px;margin:7px 0 10px}
select{width:100%;padding:17px;background:#02090b;color:white;border:1px solid #1b5358;border-radius:14px;font-size:18px}
.tfs{display:flex;gap:8px;margin-top:10px} .tf{flex:1;padding:14px;border-radius:12px;border:1px solid #1b5358;background:#061013;color:#7d9297;font-weight:800}
.tf.on{background:#0c3335;color:#2ce3d3;border-color:#2ce3d3}
.scanner{height:290px;display:grid;place-items:center;position:relative}
.ring{width:190px;height:190px;border-radius:50%;border:2px solid #17494c;position:relative;display:grid;place-items:center;box-shadow:0 0 30px #18dccc22 inset}
.ring:before{content:"";position:absolute;inset:-2px;border-radius:50%;border:4px solid transparent;border-top-color:#27e3d4;border-right-color:#27e3d4;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.num{font-size:68px;font-weight:900;color:#2ce3d3} .small{text-align:center;color:#799297;letter-spacing:2px;margin-top:7px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px} .metric{padding:15px 5px;text-align:center;border:1px solid #153b40;border-radius:13px;background:#040b0d} .metric b{display:block;margin-top:8px;color:#dcebed}
.go{width:100%;padding:20px;border:0;border-radius:16px;background:#27dfcf;color:#001111;font-size:20px;font-weight:950;margin-top:20px}
.result{display:none;text-align:center;margin-top:20px;padding:23px;border:1px solid #17484c;border-radius:18px} .result.show{display:block}
.signal{font-size:46px;font-weight:950} .up{color:#27e7a0} .down{color:#ff5b6d} .none{color:#ffbf45} .detail{color:#8da2a6;margin-top:9px}.expiry{font-size:28px;font-weight:900;color:#27e3d4;margin-top:14px}.expired{color:#ff5b6d}
.note{font-size:11px;color:#60777c;text-align:center;margin-top:15px}

<script>
const API="https://miyan-trader-ai-api.h58548388.workers.dev/";
let tf="1min";
document.querySelectorAll(".tf").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tf").forEach(x=>x.classList.remove("on"));b.classList.add("on");tf=b.dataset.v});
const sleep=m=>new Promise(r=>setTimeout(r,m));
function EMA(a,p){let k=2/(p+1),v=a[0];for(let i=1;i<a.length;i++)v=a[i]*k+v*(1-k);return v}
function RSI(a,p=14){if(a.length<=p)return 50;let g=0,l=0;for(let i=a.length-p;i<a.length;i++){let d=a[i]-a[i-1];if(d>0)g+=d;else l-=d}return l===0?100:100-100/(1+(g/p)/(l/p))}
async function getData(){
 let symbol=document.getElementById("pair").value;
 let u=API+"?symbol="+encodeURIComponent(symbol)+"&interval="+encodeURIComponent(tf);
 let r=await fetch(u,{cache:"no-store"}); if(!r.ok)throw Error("data");
 let d=await r.json(),v=d.values||d.data||(d.result&&d.result.values)||[];
 let c=v.map(x=>+x.close).filter(Number.isFinite).reverse(); if(c.length<22)throw Error("candles"); return c;
}
let expiryTimer=null;
function startExpiry(){
 clearInterval(expiryTimer);
 let left=60, el=document.getElementById("expiry");
 el.className="expiry"; el.textContent="SIGNAL VALID · 01:00";
 expiryTimer=setInterval(()=>{
   left--;
   if(left<=0){
     clearInterval(expiryTimer);
     el.textContent="SIGNAL EXPIRED";
     el.className="expiry expired";
     document.getElementById("signal").textContent="EXPIRED";
     document.getElementById("signal").className="signal none";
     return;
   }
   el.textContent="SIGNAL VALID · 00:"+String(left).padStart(2,"0");
 },1000);
}
document.getElementById("go").onclick=async()=>{
 let go=document.getElementById("go"),num=document.getElementById("num"),state=document.getElementById("state"),res=document.getElementById("result");

 try{
